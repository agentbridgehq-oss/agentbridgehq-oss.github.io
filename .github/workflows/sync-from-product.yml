name: Sync from Operator Suite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  repository_dispatch:
    types: [sync-operator-suite]

concurrency:
  group: sync-from-product
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages site
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 1

      # Only pull the paths we publish — skip .github, md packs, etc.
      - name: Checkout product (sparse)
        uses: actions/checkout@v4
        with:
          repository: agentbridgehq-oss/the-operator-suite
          path: product
          fetch-depth: 1
          sparse-checkout: |
            index.html
            inside.html
            product-cover.jpg
            og.jpg
            favicon.svg
            .nojekyll
            article.html
            path-01.html
            book.html
            coach.js
            cover-flow.js
            covers
            pdfs
          sparse-checkout-cone-mode: false

      - name: Rsync product → site
        run: |
          set -euo pipefail

          DEST_SUITE="site/the-operator-suite"
          DEST_ROOT="site"
          SRC="product"

          mkdir -p "$DEST_SUITE"

          # Root-level assets: suite path + site root mirror
          ROOT_FILES=(
            index.html inside.html product-cover.jpg og.jpg favicon.svg .nojekyll
          )
          for f in "${ROOT_FILES[@]}"; do
            if [ -f "$SRC/$f" ]; then
              rsync -a "$SRC/$f" "$DEST_SUITE/$f"
              rsync -a "$SRC/$f" "$DEST_ROOT/$f"
            fi
          done

          # Suite-only pages / scripts
          SUITE_ONLY=(article.html path-01.html book.html coach.js cover-flow.js)
          for f in "${SUITE_ONLY[@]}"; do
            if [ -f "$SRC/$f" ]; then
              rsync -a "$SRC/$f" "$DEST_SUITE/$f"
            fi
          done

          # Trees: checksum skip when identical; --delete drops removed files
          if [ -d "$SRC/covers" ]; then
            rsync -a --delete --checksum "$SRC/covers/" "$DEST_SUITE/covers/"
            rsync -a --delete --checksum "$SRC/covers/" "$DEST_ROOT/covers/"
          fi
          if [ -d "$SRC/pdfs" ]; then
            rsync -a --delete --checksum "$SRC/pdfs/" "$DEST_SUITE/pdfs/"
            rsync -a --delete --checksum "$SRC/pdfs/" "$DEST_ROOT/pdfs/"
          fi

          echo "Mirror complete"
          du -sh "$DEST_SUITE" "$DEST_SUITE/covers" "$DEST_SUITE/pdfs" 2>/dev/null || true

      - name: Commit and push (scoped)
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "operator-suite-sync"
          git config user.email "agentbridgehq@gmail.com"

          # Only stage published paths — never touch unrelated site files
          git add -A -- \
            the-operator-suite \
            index.html inside.html product-cover.jpg og.jpg favicon.svg .nojekyll \
            covers pdfs \
            || true

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Sync Operator Suite from product repo ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
