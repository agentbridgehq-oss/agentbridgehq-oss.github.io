name: Sync from Operator Suite

# Manual only. This public repo is a redirect-only mirror of the live
# Netlify storefront. Never copy playbooks, PDFs, or checkout copy here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages site
        uses: actions/checkout@v7.0.1
      - name: Refuse leftover retired checkout or unlock scripts
        run: |
          set -euo pipefail
          found=0
          search() {
            if grep -RFn --exclude-dir=.git --exclude-dir=.github --include='*.html' --include='*.js' --include='*.md' --include='*.txt' --include='*.xml' --include='*.yml' "$1" .; then
              found=1
            fi
          }
          search '$47'
          search 'bJe3cxfb'
          search '3cI4gB4wtcI5'
          search 'operator-suite-access'
          if [ "$found" = "1" ]; then
            echo 'FAIL: leftover retired checkout still in public Pages'
            exit 1
          fi
          echo 'Public Pages is a redirect-only mirror. Paid files were not copied.'
