name: Sync from Operator Suite

# Manual only. This public repo is a redirect-only mirror of the live
# Netlify storefront. Never copy playbooks, PDFs, or checkout copy here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages site
        uses: actions/checkout@v4

      - name: Refuse leftover $47 checkout or unlock scripts
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude-dir=.github -E '\$47|bJe3cxfb|3cI4gB4wtcI5|operator-suite-access' .; then
            echo 'FAIL: leftover $47 checkout or unlock script still in public Pages'
            exit 1
          fi
          echo "Public Pages is a redirect-only mirror. Paid files were not copied."
