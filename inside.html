<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Inside — The Operator Suite</title>
<meta name="robots" content="noindex"/>
<style>
:root{--ink:#171512;--gold:#a4844e;--paper:#f4efe6;--soft:#7a746b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Georgia,serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.card{max-width:520px;width:100%;text-align:center}
.kicker{letter-spacing:.2em;font-size:12px;color:var(--gold);font-family:system-ui,sans-serif;margin-bottom:12px}
h1{font-size:36px;font-weight:500;margin-bottom:12px}
p{color:var(--soft);margin-bottom:16px;font-family:system-ui,sans-serif}
.price{font-size:22px;color:var(--ink);margin:20px 0}
.btn{display:block;width:100%;min-height:48px;line-height:48px;background:var(--gold);color:var(--ink);text-decoration:none;font-weight:600;font-family:system-ui,sans-serif;margin:10px 0}
.btn-ghost{background:transparent;border:1px solid rgba(164,132,78,.5)}
.note{font-size:13px;margin-top:20px}

<div class="card">

  <div class="price">$47 one-time</div>
  <a class="btn" href="https://buy.stripe.com/bJe3cxfb79vTd48cWe7ok09">Buy on Stripe</a>
  <a class="btn btn-ghost" href="https://stan.store/hunter82">Buy on Stan</a>

</div>
</body>
</html>
